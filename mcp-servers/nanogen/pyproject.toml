[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanogen"
version = "0.1.0"
description = "Tiny stdlib-only MCP server wrapping Google's Gemini image generation API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Brian Yu" },
]
keywords = ["mcp", "gemini", "image-generation", "claude", "nano-banana"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries",
]
# Intentionally no dependencies — stdlib only.
dependencies = []

[project.urls]
Homepage = "https://github.com/brianyu18/nanogen"
Repository = "https://github.com/brianyu18/nanogen"
Issues = "https://github.com/brianyu18/nanogen/issues"

[project.scripts]
nanogen = "server:main"
